[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: eilučių ilgio limitas netaikomas (ruff format tvarko formatavimą).
# B008: FastAPI DI idiomatiškai naudoja Depends(...) kaip numatytąją reikšmę.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
markers = [
    "live: tests that hit real external websites (not run in CI by default)",
]
testpaths = ["tests"]
