    ignored_path_hints: []
    adapter: generic_html
    adapter_config: {}
    check_frequency_hours: 24
    status: blocked_in_current_runtime
    is_official: true
    enabled: false
    notes: >
      2026-09-02 (patikrinta pakartotinai): HTTP 403, antraštės "server: cloudflare",
      "cf-mitigated: challenge", Content-Type "text/html; charset=UTF-8", turinys
      "Just a moment..." — tiek pačiam puslapiui, tiek /robots.txt. Tas pats atsakymas gautas
      ir per jra.lt (skirtingas domenas, bet 301 nukreipia į tą patį jra.lrv.lt).
      Playwright/Chromium patikra iš ŠIOS kūrimo sandėžos aplinkos NEĮMANOMA dėl sandėžos
      tinklo proxy apribojimo naršyklės eismui (net kontrolinis bandymas į example.com grąžina
      tą pačią ERR_CONNECTION_RESET klaidą — tai sandėžos, ne Cloudflare/JRA problema).
      Realų Playwright kelio rezultatą reikia patikrinti iš tikros hostingo aplinkos komanda
      `python -m app.scripts.smoke_test_jra_vilnius` (žr. README). Instrukcijos draudžia apeiti
      CAPTCHA/JS iššūkius, todėl automatinis crawl išjungtas nepriklausomai nuo rezultato.
      Statusas "blocked_in_current_runtime" (NE "disabled") — savaitinė automatinė patikra
      (app/crawler/availability_probe.py) automatiškai pažymės "needs_verification", jei
      prieiga atsilaisvins. Alternatyvus/susijęs šaltinis: socmin_projektu_konkursai (žr.
      žemiau) — TAS PATS Cloudflare blokavimas, bet skelbia gretimas NVO/jaunimo/šeimos
      projektų konkursų programas iš LR socialinės apsaugos ir darbo ministerijos, kuri
      administruoja dalį JRA finansuojamų sričių.

