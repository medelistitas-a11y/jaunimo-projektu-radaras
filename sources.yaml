# Šaltinių registras. Seedinamas į DB paleidimo metu (app/seed/sources_seed.py),
# po to redaguojamas per DB/administravimo veiksmus. Visi URL ir statusai čia
# atitinka realų patikrinimą, aprašytą SOURCE_AUDIT.md (data: 2026-09-02).
#
# status reikšmės: active | blocked_bot_protection | needs_verification | disabled
# source_type: html | rss | sitemap | api | search | js | unknown

sources:
  - code: jra_finansavimo_konkursai
    name: "JRA finansavimo konkursai"
    institution_name: "Jaunimo reikalų agentūra"
    municipality: null
    region: null
    official_domain: jra.lrv.lt
    start_urls:
      - https://jra.lrv.lt/lt/finansavimo-konkursai/
    source_type: html
    allowed_document_domains: [jra.lrv.lt, lrv.lt]
    relevant_path_hints: ["finansavimo-konkursai", "konkursai"]
    ignored_path_hints: []
    adapter: generic_html
    adapter_config: {}
    check_frequency_hours: 24
    status: blocked_bot_protection
    is_official: true
    enabled: false
    notes: >
      2026-09-02: HTTP 403, Cloudflare "Just a moment..." JS iššūkis (cf-mitigated: challenge)
      tiek pačiam puslapiui, tiek /robots.txt. Instrukcijos draudžia apeiti CAPTCHA/JS iššūkius,
      todėl automatinis crawl išjungtas. UI turi rodyti "Atidaryti originalų puslapį" nuorodą
      rankinei peržiūrai. Privalomas šaltinis pagal užduotį — statusas bus pertikrinamas
      kiekvieno etapo metu, jei Cloudflare konfigūracija pasikeis.

  - code: vilnius_konkursai
    name: "Vilniaus miesto konkursų sistema"
    institution_name: "Vilniaus miesto savivaldybė"
    municipality: "Vilniaus m."
    region: "Vilniaus apskritis"
    official_domain: vilnius.lt
    start_urls:
      - https://konkursai.vilnius.lt/konkursai
    source_type: unknown
    allowed_document_domains: [vilnius.lt, konkursai.vilnius.lt]
    relevant_path_hints: ["jaunim", "konkurs"]
    ignored_path_hints: []
    adapter: generic_html
    adapter_config: {}
    check_frequency_hours: 24
    status: blocked_bot_protection
    is_official: true
    enabled: false
    notes: >
      2026-09-02: HTTP 403, Cloudflare JS iššūkis. Taip pat blokuoja pagrindinį vilnius.lt
      domeną. Privalomas šaltinis — rankinės peržiūros nuoroda UI.

  - code: kaunas_naujienos
    name: "Kauno miesto savivaldybės naujienos"
    institution_name: "Kauno miesto savivaldybė"
    municipality: "Kauno m."
    region: "Kauno apskritis"
    official_domain: kaunas.lt
    start_urls:
      - https://www.kaunas.lt/kategorija/naujienos/
    source_type: html
    allowed_document_domains: [kaunas.lt]
    relevant_path_hints: []
    ignored_path_hints: ["/kategorija/eismo-informacija", "/kategorija/orai"]
    adapter: generic_html
    adapter_config:
      list_item_selector: "article"
      link_selector: "h3 a, h2 a, a"
      title_selector: "h3, h2"
    check_frequency_hours: 24
    status: active
    is_official: true
    enabled: true
    notes: >
      2026-09-02: HTTP 200, realus turinys patikrintas. Naudojama vertikaliame pjūvyje kaip
      "savivaldybė su paprastu HTML naujienų sąrašu".

  - code: skuodas_wp_api
    name: "Skuodo rajono savivaldybė (WordPress naujienos)"
    institution_name: "Skuodo rajono savivaldybė"
    municipality: "Skuodo r."
    region: "Klaipėdos apskritis"
    official_domain: skuodas.lt
    start_urls:
      - https://skuodas.lt/wp-json/wp/v2/posts
    source_type: api
    allowed_document_domains: [skuodas.lt]
    relevant_path_hints: []
    ignored_path_hints: []
    adapter: wp_json
    adapter_config:
      search_terms: ["jaunim", "mokym", "prevencij", "konkurs", "kvietim"]
      per_page: 20
    check_frequency_hours: 24
    status: active
    is_official: true
    enabled: true
    notes: >
      2026-09-02: HTTP 200, /wp-json/wp/v2/posts?search=jaunim patikrinta rankiniu būdu, grąžina
      realius įrašus. Naudojama vertikaliame pjūvyje kaip "nestandartinis adapteris" (REST API
      vietoje HTML naršymo).

  - code: ltkt_organizacijoms
    name: "Lietuvos kultūros taryba – konkursai organizacijoms"
    institution_name: "Lietuvos kultūros taryba"
    municipality: null
    region: null
    official_domain: ltkt.lt
    start_urls:
      - https://www.ltkt.lt/organizacijoms/konkursai
    source_type: html
    allowed_document_domains: [ltkt.lt]
    relevant_path_hints: []
    ignored_path_hints: []
    adapter: generic_html
    adapter_config: {}
    check_frequency_hours: 48
    status: needs_verification
    is_official: true
    enabled: false
    notes: >
      2026-09-02: HTTP 200 (puslapis pasiekiamas), BET sąrašo puslapis yra HTML lentelė
      (.table_ref_box su tuščiais "rodyklės" nuorodų tekstais, pavadinimas kitoje stulpelio
      ląstelėje), ne straipsnių sąrašas — bendras generic_html adapteris (article/a
      numatytieji selektoriai) klaidingai sujungia visą puslapio meniu į vieną "elementą".
      Realiu bandymu tai patvirtinta pirmame rankiniame crawl teste (sukūrė vieną Opportunity
      su sujungtu meniu tekstu kaip pavadinimu ir neteisingai priskirtu dideliu biudžetu).
      Kol nesukurtas skirtas lentelės adapteris, šaltinis IŠJUNGTAS automatiniam crawl
      (enabled: false), kad nebūtų generuojami klaidingi įrašai. Antrinis/stebimas šaltinis —
      LTKT fokusas yra kultūra/menas, ne jaunimas.

  - code: lietuvos_kulturos_kongresas
    name: "Lietuvos kultūros kongresas"
    institution_name: "Lietuvos kultūros kongresas"
    municipality: null
    region: null
    official_domain: ""
    start_urls: []
    source_type: unknown
    allowed_document_domains: []
    relevant_path_hints: []
    ignored_path_hints: []
    adapter: generic_html
    adapter_config: {}
    check_frequency_hours: 168
    status: needs_verification
    is_official: false
    enabled: false
    notes: >
      Šios sesijos metu nerastas oficialus, nuolat atnaujinamas kvietimų/projektų archyvas su
      patikimu domenu. Pagal instrukcijas URL negalima išgalvoti. Administratorius turi įrašyti
      tikrą official_domain/start_urls, jei nustato, kad tai produktyvus šaltinis — kitaip paliekamas
      neaktyvus.


